<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoGuat- Tecnología de Calidad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="Principal">
            <h1>TecnoGuat</h1>
            <p>"Para los amantes de la tecnologia"</p>
        </div>
        <nav>
            <ul class="nav-links">
                <img src="imgs/Logo.png" alt="Logo">
                <li class="li-Inicio"><a href="index.html">Inicio</a></li>
                <li class="li-Productos"><a href="Productos.html">Productos</a></li>
                <li class="li-Contactos"><a href="index.html">Contactos</a></li>
            </ul>
        </nav>
    </header>
    <section>
        <div class="Product-1">
            <div class="Product-Imagenes">
                <div class="slider">
                    <img src="imgs/Airpods.jpeg" alt="" class="Imagen ImagenActiva" >
                    <img src="imgs/Airpods azules.jpg" alt=""  class="Imagen">
                    <img src="imgs/Airpods rojos.jpeg" alt="" class="Imagen">
                </div>
            </div>
            <button class="flecha flecha-izquierda">&#10094</button>
            <button class="flecha flecha-derecha">&#10095</button>
            <div class="Text">
                <h2>Airpods</h2>
                <p>Precio: <span>Q250🔥</span></p><br>
                <p>Aprovecha nuestra oferta de verano y adquiere <br>
                Airpods de diferentes colores de calidad y los <br>
                precios.</p> <br>
            </div>
        </div>
        <div class="Btn-1">
            <button class="buy-button">Comprar Ahora</button>
        </div>
         <div class="TecnoGuat-chatbot">
            <div class="chatbot-header">
                <span>TecnoGuatBot</span>
                <button class="chatbot-cerrar-btn">x</button>
            </div>
            <div class="chatbot-mensajes"></div>
            <div class="chatbot-input">
                <input type="text" placeholder="Pregunta Aqui..." class="chatbot-user-input">
                <button class="chatbot-enviar-btn">Enviar</button>
            </div>
        </div>
    </section>
    <script src="Script.js"></script>
</body>
</html>
